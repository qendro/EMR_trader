[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroevo"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["jax==0.6.1", "numpy==1.26.4"]

[project.scripts]
neuroevo = "neuroevo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
